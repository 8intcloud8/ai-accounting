<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>@@TITLE@@</title><style>body{font:15px system-ui;margin:40px;color:#182b36;background:#f6f8fa}main{max-width:1400px;margin:auto}h1{font-size:28px}small{color:#5d6b73}table{width:100%;border-collapse:collapse;background:white}td,th{padding:12px;text-align:left;border-bottom:1px solid #e1e7eb}input[type=checkbox]{width:19px;height:19px}input[type=text]{padding:10px;border:1px solid #9caab4;border-radius:6px}#filter{width:300px}#root{width:60%}.controls{background:white;padding:20px;margin:20px 0;border-radius:10px}button{padding:10px 16px;background:#126b5a;color:white;border:0;border-radius:6px}button:disabled{opacity:.45}textarea{width:95%;height:100px;margin-top:15px}#count{margin-left:20px;font-weight:bold}</style><main><h1>@@HEADING@@</h1><p id="period">@@PERIOD@@</p><p id="accounts">@@ACCOUNTS@@</p><p id="totals">@@TOTALS@@</p><div class="controls"><label><input type="checkbox" id="all" checked> Select all</label><span id="count"></span><p><input type="text" id="filter" placeholder="Filter invoices" aria-label="Filter invoices"></p><div><button id="choose-folder" type="button">Choose folder</button> <input type="text" id="root" value="@@DESTINATION@@" placeholder="Enter folder path to save" aria-label="Enter folder path to save"></div><p><small>Choose invoices and a folder. Copy request, then paste into this chat to save.</small></p><textarea id="request" aria-label="Save request" readonly></textarea><div style="margin-top:10px"><button id="copy" disabled>Copy save request</button></div></div><table><thead><tr><th>Select</th><th>Date</th><th>Vendor</th><th>Subject</th><th>Documents</th><th>Link</th></tr></thead><tbody>@@ROWS@@</tbody></table></main><dialog id="picker" aria-labelledby="picker-title"><h2 id="picker-title">Choose destination folder</h2><p id="picker-path"></p><button id="parent-folder" type="button">Parent folder</button><div id="directories" style="max-height:45vh;overflow:auto;margin:15px 0"></div><p id="picker-error" role="status"></p><button id="use-folder" type="button">Use this folder</button> <button id="cancel-folder" type="button">Cancel</button></dialog><script>
const config=@@CONFIG@@;const boxes=[...document.querySelectorAll('.bill')],root=document.querySelector('#root'),request=document.querySelector('#request');function update(){const ids=boxes.filter(b=>b.checked).map(b=>b.value),r=root.value.trim().replace(/\/+$/,'')||(root.value.trim().startsWith('/')?'/':'');document.querySelector('#count').textContent=ids.length+' / '+boxes.length+' selected';document.querySelector('#copy').disabled=!r||!ids.length;request.value=r&&ids.length?'Save these '+ids.length+' bill(s) to root folder '+JSON.stringify(r)+' (category: '+config.category+', date range: '+config.from+' to '+config.to+', thread ids: '+ids.join(', ')+')':'';document.querySelector('#all').checked=boxes.length>0&&ids.length===boxes.length;document.querySelector('#all').indeterminate=ids.length>0&&ids.length<boxes.length;}
boxes.forEach(b=>b.onchange=update);root.oninput=update;document.querySelector('#all').onchange=e=>{boxes.forEach(b=>b.checked=e.target.checked);update()};document.querySelector('#filter').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))};document.querySelector('#copy').onclick=async()=>{request.select();try{await navigator.clipboard.writeText(request.value);document.querySelector('#copy').textContent='Copied — paste into chat'}catch{document.querySelector('#copy').textContent='Select request text and copy'}};update();
</script><script>
const picker=document.querySelector('#picker');let currentFolder='',parentFolder='',browseSequence=0;
async function browseFolder(path){
 const sequence=++browseSequence;
 document.querySelector('#picker-error').textContent='';document.querySelector('#use-folder').disabled=true;
 try { const response=await fetch('/api/folders?path='+encodeURIComponent(path),{headers:{'X-Folder-Picker':config.pickerToken}});
 if(!response.ok)throw new Error('Cannot open this folder');const data=await response.json();if(sequence!==browseSequence)return;
 currentFolder=data.path;parentFolder=data.parent;document.querySelector('#picker-path').textContent=currentFolder;
 const list=document.querySelector('#directories');list.replaceChildren();
 for(const entry of data.directories){const button=document.createElement('button');button.type='button';button.textContent='📁 '+entry.name;button.style.cssText='display:block;margin:6px 0;background:#edf3f1;color:#182b36;width:100%;text-align:left';button.onclick=()=>browseFolder(entry.path);list.append(button);}
 document.querySelector('#parent-folder').disabled=!parentFolder;document.querySelector('#use-folder').disabled=false;
 }catch(error){if(sequence!==browseSequence)return;document.querySelector('#picker-error').textContent=error.message;}
}
document.querySelector('#choose-folder').onclick=()=>{picker.showModal();browseFolder(root.value.trim()||config.pickerHome);};
document.querySelector('#parent-folder').onclick=()=>browseFolder(parentFolder);
document.querySelector('#use-folder').onclick=()=>{root.value=currentFolder;update();picker.close();};
document.querySelector('#cancel-folder').onclick=()=>picker.close();
</script></html>
