<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>@@TITLE@@</title><style>
:root{color-scheme:light dark;--bg:#fff;--secondary:#f5f5f5;--text:#242424;--muted:#6b6b6b;--border:#e1e1e1;--accent:#16724b;--selected:#f0f8f3;--ring:#378cbd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1100px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:16px}h1{font-size:22px;font-weight:600;line-height:1.3;margin:0}h2{font-size:16px;margin:0 0 10px}.subtitle{color:var(--muted);margin:7px 0 0;font-size:13px;line-height:1.5}.scope{background:var(--secondary);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;overflow-wrap:anywhere}.scope strong{color:var(--text);font-weight:500}.scope .status{margin-left:auto;font-size:12px;white-space:nowrap}.summary{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.summary strong{color:var(--text);font-weight:600}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.select-all{display:flex;gap:8px;align-items:center;white-space:nowrap;font-size:13px}.counter{font-weight:600;font-size:13px}.spacer{flex:1}.filter-input,select{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}.filter-input{width:250px;max-width:100%}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:65vh}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th{position:sticky;top:0;z-index:1;background:var(--secondary);color:var(--text);font-weight:600;white-space:nowrap}th,td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:top}tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:var(--secondary)}tr.selected{background:var(--selected)}tr.moved{opacity:.6}.check-cell{width:34px;text-align:center}.date-cell{white-space:nowrap;font-size:12px;color:var(--muted)}.vendor{min-width:115px;font-weight:500}.document-cell{min-width:170px;max-width:250px}.filename{overflow-wrap:anywhere;line-height:1.5}.record-meta{font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.badge{display:inline-block;padding:3px 6px;border-radius:5px;background:#eaf3eb;color:#2e6235;font-size:11px;line-height:1.4;white-space:nowrap}.badge.support{background:#fff2d4;color:#765817}.badge.control{background:#edf0f5;color:#526071}.money{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}.money small{display:block;font-size:10px;color:var(--muted);margin-top:4px;font-weight:400}.open{white-space:nowrap}.reason-cell{min-width:86px;max-width:240px}details summary{cursor:pointer;font-size:12px;color:var(--muted);white-space:nowrap}details p{font-size:12px;line-height:1.55;overflow-wrap:anywhere;margin:8px 0;color:var(--muted)}a{color:var(--accent);text-decoration:none;font-size:12px}a:hover{text-decoration:underline}input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0;cursor:pointer;vertical-align:middle}button{font:inherit;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:9px 13px;background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ring);outline-offset:3px}.action-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.action-bar .muted{flex:1;font-size:12px}.muted,.protected{color:var(--muted)}.protected{font-size:10px}.note{font-size:12px;line-height:1.55;color:var(--muted)}.guidance{padding:12px 14px;border:1px solid var(--border);border-radius:8px}.guidance summary{font-size:13px;color:var(--text)}.guidance ul{font-size:12px;line-height:1.65;color:var(--muted);padding-left:20px;margin:10px 0 0}.empty{padding:28px;text-align:center;color:var(--muted)}.result{background:var(--selected);border:1px solid var(--border);padding:14px;border-radius:8px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.result button{margin-top:10px}.success-title{font-weight:600}.error{color:#a64225;font-size:13px;line-height:1.5}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{background:var(--bg);color:var(--text);max-width:700px;width:calc(100% - 32px);max-height:85vh;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:24px}dialog::backdrop{background:#0008}dialog ul{max-height:30vh;overflow:auto;padding-left:20px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}dialog li{padding-bottom:10px}dialog small{display:block;color:var(--muted)}textarea{width:100%;min-height:80px;font:inherit;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:10px;margin:8px 0;background:var(--bg);color:var(--text)}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
@media(prefers-color-scheme:dark){:root{--bg:#202020;--secondary:#292929;--text:#ededed;--muted:#aaa;--border:#3e3e3e;--accent:#71cda1;--selected:#25392f;--ring:#8bb9ee}.badge{background:#294033;color:#a0d5ad}.badge.support{background:#44391e;color:#e4c97b}.badge.control{background:#303746;color:#b1c1dc}button.primary{background:#71cda1;color:#14281d}.error{color:#f19b80}}
@media(max-width:700px){main{padding:16px;gap:14px}.filter-input{width:100%}.toolbar .spacer{display:none}.table-wrap{max-height:60vh}.action-bar .muted{flex-basis:100%}h1{font-size:20px}}

/* Shared controls also used by the email invoice checklist. */
body{font-family:inherit;font-size:inherit;line-height:normal;font-weight:400}
.scope input{flex:1;min-width:180px}.toolbar .filter-input{margin-left:auto}.button-secondary{background:var(--bg);color:var(--text)}
.link-button{background:none;border:0;padding:0;color:var(--accent);font-size:12px;font-weight:400;cursor:pointer}.link-button:hover{text-decoration:underline}.action-bar>.muted{flex:1}.guidance>p{font-size:12px;line-height:1.55;color:var(--muted)}

.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controls p{margin:0}.controls label{display:flex;align-items:center;gap:8px;font-size:13px}
input[type=text]{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
#root{flex:1;min-width:240px}#filter{width:220px}#count{font-size:13px;font-weight:600}
button{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--accent);color:white;cursor:pointer}
button:disabled{opacity:.45;cursor:default}textarea{flex-basis:100%;width:100%;height:72px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px}
#period,#accounts,#totals{margin:0;font-size:13px;color:var(--muted)}
</style><main><h1>@@HEADING@@</h1><p id="period">@@PERIOD@@</p><p id="accounts">@@ACCOUNTS@@</p><p id="totals">@@TOTALS@@</p><div class="controls"><label><input type="checkbox" id="all" checked> Select all</label><span id="count"></span><p><input type="text" id="filter" placeholder="Filter invoices" aria-label="Filter invoices"></p><div><button id="choose-folder" type="button">Choose folder</button> <input type="text" id="root" value="@@DESTINATION@@" placeholder="Enter folder path to save" aria-label="Enter folder path to save"></div><p><small>Choose invoices and a folder. Copy request, then paste into this chat to save.</small></p><textarea id="request" aria-label="Save request" readonly></textarea><div style="margin-top:10px"><button id="copy" disabled>Copy save request</button></div></div><table><thead><tr><th>Select</th><th>Date</th><th>Vendor</th><th>Subject</th><th>Documents</th><th>Link</th></tr></thead><tbody>@@ROWS@@</tbody></table></main><dialog id="picker" aria-labelledby="picker-title"><h2 id="picker-title">Choose destination folder</h2><p id="picker-path"></p><button id="parent-folder" type="button">Parent folder</button><div id="directories" style="max-height:45vh;overflow:auto;margin:15px 0"></div><p id="picker-error" role="status"></p><button id="use-folder" type="button">Use this folder</button> <button id="cancel-folder" type="button">Cancel</button></dialog><script>
const config=@@CONFIG@@;const boxes=[...document.querySelectorAll('.bill')],root=document.querySelector('#root'),request=document.querySelector('#request');function update(){const ids=boxes.filter(b=>b.checked).map(b=>b.value),r=root.value.trim().replace(/\/+$/,'')||(root.value.trim().startsWith('/')?'/':'');document.querySelector('#count').textContent=ids.length+' / '+boxes.length+' selected';document.querySelector('#copy').disabled=!r||!ids.length;request.value=r&&ids.length?'Save these '+ids.length+' bill(s) to root folder '+JSON.stringify(r)+' (category: '+config.category+', date range: '+config.from+' to '+config.to+', thread ids: '+ids.join(', ')+', message ids: '+boxes.filter(b=>b.checked).map(b=>b.dataset.message).join(', ')+')':'';document.querySelector('#all').checked=boxes.length>0&&ids.length===boxes.length;document.querySelector('#all').indeterminate=ids.length>0&&ids.length<boxes.length;}
boxes.forEach(b=>b.onchange=update);root.oninput=update;document.querySelector('#all').onchange=e=>{boxes.forEach(b=>b.checked=e.target.checked);update()};document.querySelector('#filter').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))};document.querySelector('#copy').onclick=async()=>{request.select();try{await navigator.clipboard.writeText(request.value);document.querySelector('#copy').textContent='Copied — paste into chat'}catch{document.querySelector('#copy').textContent='Select request text and copy'}};update();
</script><script>
const picker=document.querySelector('#picker');let currentFolder='',parentFolder='',browseSequence=0;
async function browseFolder(path){
 const sequence=++browseSequence;
 document.querySelector('#picker-error').textContent='';document.querySelector('#use-folder').disabled=true;
 try { const response=await fetch('/api/folders?path='+encodeURIComponent(path),{headers:{'X-Folder-Picker':config.pickerToken}});
 if(!response.ok)throw new Error('Cannot open this folder');const data=await response.json();if(sequence!==browseSequence)return;
 currentFolder=data.path;parentFolder=data.parent;document.querySelector('#picker-path').textContent=currentFolder;
 const list=document.querySelector('#directories');list.replaceChildren();
 for(const entry of data.directories){const button=document.createElement('button');button.type='button';button.textContent='📁 '+entry.name;button.style.cssText='display:block;margin:6px 0;background:#edf3f1;color:#182b36;width:100%;text-align:left';button.onclick=()=>browseFolder(entry.path);list.append(button);}
 document.querySelector('#parent-folder').disabled=!parentFolder;document.querySelector('#use-folder').disabled=false;
 }catch(error){if(sequence!==browseSequence)return;document.querySelector('#picker-error').textContent=error.message;}
}
document.querySelector('#choose-folder').onclick=()=>{picker.showModal();browseFolder(root.value.trim()||config.pickerHome);};
document.querySelector('#parent-folder').onclick=()=>browseFolder(parentFolder);
document.querySelector('#use-folder').onclick=()=>{root.value=currentFolder;update();picker.close();};
document.querySelector('#cancel-folder').onclick=()=>picker.close();
</script></html>
